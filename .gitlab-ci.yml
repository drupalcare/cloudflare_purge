# GitLab CI configuration for Cloudflare Purge module

stages:
  - test

# Default Docker image with PHP and Composer
default:
  image: php:8.3-cli

# Cache Composer dependencies
cache:
  paths:
    - vendor/

# Run PHP CodeSniffer to check Drupal coding standards
phpcs:
  stage: test
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer require --dev drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer
  script:
    - vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,css,info,txt,md,yml src/
  only:
    - merge_requests
    - main
    - branches

# Run PHPStan for static analysis
phpstan:
  stage: test
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer require --dev phpstan/phpstan:^1.10
  script:
    - vendor/bin/phpstan analyse src/
  allow_failure: true
  only:
    - merge_requests
    - main
    - branches
