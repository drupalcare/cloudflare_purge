services:
  # Logger channel for all Cloudflare Purge operations.
  logger.channel.cloudflare_purge:
    parent: logger.channel_base
    arguments: ['cloudflare_purge']

  # Low-level API service for Cloudflare communication.
  cloudflare_purge.api:
    class: Drupal\cloudflare_purge\CloudflarePurgeApi
    arguments:
      - '@http_client'
      - '@logger.channel.cloudflare_purge'

  # Shared cache-tag formatter (filter + prefix + optional hash + size guard).
  # Single source of truth so the Cache-Tag header and tag-purge calls match.
  cloudflare_purge.cache_tag_formatter:
    class: Drupal\cloudflare_purge\Cache\CacheTagFormatter
    arguments:
      - '@config.factory'
      - '@logger.channel.cloudflare_purge'

  # Reads recent purge log entries (watchdog) for the history page.
  cloudflare_purge.history:
    class: Drupal\cloudflare_purge\PurgeHistory
    arguments:
      - '@database'

  # Deduplicated store of cache tags awaiting a Cloudflare purge.
  cloudflare_purge.pending_tags_store:
    class: Drupal\cloudflare_purge\PendingTagsStore
    arguments:
      - '@database'

  # Drains the pending-tags store into batched, FIFO-ordered queue items.
  cloudflare_purge.pending_tag_drainer:
    class: Drupal\cloudflare_purge\PendingTagDrainer
    arguments:
      - '@cloudflare_purge.pending_tags_store'
      - '@queue'
      - '@lock'
      - '@logger.channel.cloudflare_purge'

  # Advises whether the purge queue may be growing faster than it can drain.
  cloudflare_purge.queue_backlog_advisor:
    class: Drupal\cloudflare_purge\QueueBacklogAdvisor
    arguments:
      - '@config.factory'
      - '@cloudflare_purge.pending_tags_store'
      - '@queue'
      - '@string_translation'

  # Single source of truth for credential, auth-method and storage resolution.
  cloudflare_purge.credential_resolver:
    class: Drupal\cloudflare_purge\CredentialResolver
    arguments:
      - '@config.factory'
      - '@module_handler'
      - '@?key.repository'

  # Main purge service with credential resolution and messaging.
  cloudflare_purge.purge:
    class: Drupal\cloudflare_purge\Purge
    arguments:
      - '@config.factory'
      - '@logger.channel.cloudflare_purge'
      - '@messenger'
      - '@cloudflare_purge.api'
      - '@state'
      - '@cloudflare_purge.cache_tag_formatter'
      - '@cloudflare_purge.credential_resolver'

  # Cache tag invalidator for automatic Cloudflare purging.
  cloudflare_purge.cache_tag_invalidator:
    class: Drupal\cloudflare_purge\Cache\CloudflareCacheTagInvalidator
    arguments:
      - '@cloudflare_purge.purge'
      - '@config.factory'
      - '@logger.channel.cloudflare_purge'
      - '@cloudflare_purge.pending_tags_store'
      - '@cloudflare_purge.cache_tag_formatter'
    tags:
      # Lower priority so Drupal's internal invalidation runs first.
      - { name: cache_tags_invalidator, priority: -100 }

  # Event subscriber for adding Cache-Tag headers to responses.
  cloudflare_purge.event_subscriber:
    class: Drupal\cloudflare_purge\EventSubscriber\CloudflarePurgeSubscriber
    arguments:
      - '@config.factory'
      - '@logger.channel.cloudflare_purge'
      - '@cloudflare_purge.cache_tag_formatter'
    tags:
      - { name: event_subscriber }
