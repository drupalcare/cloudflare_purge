# Cloudflare Purge configuration schema.

cloudflare_purge.settings:
  type: config_object
  label: 'Cloudflare Purge settings'
  mapping:
    # Authentication settings.
    auth_method:
      type: string
      label: 'Authentication method'
      constraints:
        Choice:
          choices:
            - bearer
            - legacy

    storage_method:
      type: string
      label: 'Credential storage method'
      constraints:
        Choice:
          choices:
            - plain
            - key

    # Plain text credentials.
    zone_id:
      type: string
      label: 'Cloudflare Zone ID'

    email:
      type: string
      label: 'Cloudflare account email'

    authorization:
      type: string
      label: 'Cloudflare API Key'

    bearer_token:
      type: string
      label: 'Cloudflare API Bearer Token'

    # Key module references.
    zone_id_key:
      type: string
      label: 'Zone ID key reference'

    email_key:
      type: string
      label: 'Email key reference'

    authorization_key:
      type: string
      label: 'API Key key reference'

    bearer_token_key:
      type: string
      label: 'Bearer Token key reference'

    # Auto-purge settings.
    auto_purge_enabled:
      type: boolean
      label: 'Enable automatic cache tag purging'

    auto_purge_entity_types:
      type: sequence
      label: 'Entity types for automatic purging'
      sequence:
        type: string
        label: 'Entity type ID'

    auto_purge_use_queue:
      type: boolean
      label: 'Use queue for automatic purging'

    purge_everything_on_flush:
      type: boolean
      label: 'Purge the entire Cloudflare zone when all Drupal caches are flushed'

    queue_max_age_enabled:
      type: boolean
      label: 'Discard queued purge items older than the configured TTL'

    queue_max_age:
      type: integer
      label: 'Maximum age (seconds) before a queued purge item is discarded'
      constraints:
        Range:
          min: 1
          max: 2592000

    tag_prefix:
      type: string
      label: 'Cache tag prefix'

    auto_purge_filter_header_tags:
      type: boolean
      label: 'Emit only purgeable cache tags in the Cache-Tag header'

    auto_purge_hash_tags:
      type: boolean
      label: 'Hash cache tags in the Cache-Tag header and purge calls'

    auto_purge_hash_length:
      type: integer
      label: 'Hashed tag length (hex characters)'
      constraints:
        Range:
          min: 6
          max: 64

    auto_purge_header_max_bytes:
      type: integer
      label: 'Maximum Cache-Tag header size in bytes'
      constraints:
        Range:
          min: 1024
          max: 16384

    # Rate limiting settings.
    rate_limit_enabled:
      type: boolean
      label: 'Enable rate limiting'

    rate_limit_per_minute:
      type: integer
      label: 'Maximum requests per minute'
      constraints:
        Range:
          min: 1
          max: 1000

    # Logging settings.
    logging_enabled:
      type: boolean
      label: 'Enable detailed logging'

    history_limit:
      type: integer
      label: 'Number of purge history entries to display'
      constraints:
        Range:
          min: 1
          max: 1000

    # Legacy setting (deprecated, migrated in update hook).
    use_bearer_token:
      type: boolean
      label: 'Use Bearer Token (deprecated)'
