# Cloudflare Purge module routing configuration.

# Neutral landing page for the Cloudflare Purge admin section. It only lists the
# child links the current user can access, so the menu section is reachable by
# anyone with at least one Cloudflare Purge permission (e.g. a user who may only
# perform manual purges) instead of being gated behind "Administer Cloudflare
# Purge". Each child route still enforces its own permission.
cloudflare_purge.admin_config:
  path: '/admin/config/cloudflare-purge'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Cloudflare Purge'
  requirements:
    _permission: 'administer cloudflare purge+cloudflare purge+cloudflare purge everything+view cloudflare purge history'
  options:
    _admin_route: TRUE

# Main credentials configuration form.
cloudflare_purge.form:
  path: '/admin/config/cloudflare-purge/credentials'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeForm'
    _title: 'Cloudflare Credentials'
  requirements:
    _permission: 'administer cloudflare purge'
  options:
    _admin_route: TRUE

# Auto-purge settings form.
cloudflare_purge.settings:
  path: '/admin/config/cloudflare-purge/settings'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeSettingsForm'
    _title: 'Auto-Purge Settings'
  requirements:
    _permission: 'administer cloudflare purge'
  options:
    _admin_route: TRUE

# Purge by URL form (supports single and multiple URLs).
cloudflare_purge.purge_by_url:
  path: '/admin/config/cloudflare-purge/purge-url'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeByUrl'
    _title: 'Purge by URL'
  requirements:
    _permission: 'cloudflare purge'
  options:
    _admin_route: TRUE

# Purge by cache tag form.
cloudflare_purge.purge_by_tag:
  path: '/admin/config/cloudflare-purge/purge-tag'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeByTag'
    _title: 'Purge by Cache Tag'
  requirements:
    _permission: 'cloudflare purge'
  options:
    _admin_route: TRUE

# Purge by URL prefix form.
cloudflare_purge.purge_by_prefix:
  path: '/admin/config/cloudflare-purge/purge-prefix'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeByPrefix'
    _title: 'Purge by Prefix'
  requirements:
    _permission: 'cloudflare purge'
  options:
    _admin_route: TRUE

# Purge by hostname form.
cloudflare_purge.purge_by_hostname:
  path: '/admin/config/cloudflare-purge/purge-hostname'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeByHostname'
    _title: 'Purge by Hostname'
  requirements:
    _permission: 'cloudflare purge'
  options:
    _admin_route: TRUE

# Purge everything confirmation form.
cloudflare_purge.purge_everything:
  path: '/admin/config/cloudflare-purge/purge-everything'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeEverything'
    _title: 'Purge Everything'
  requirements:
    _permission: 'cloudflare purge everything'
  options:
    _admin_route: TRUE

# Purge history page.
cloudflare_purge.history:
  path: '/admin/config/cloudflare-purge/history'
  defaults:
    _controller: '\Drupal\cloudflare_purge\Controller\CloudflarePurgeController::history'
    _title: 'Purge History'
  requirements:
    _permission: 'view cloudflare purge history'
  options:
    _admin_route: TRUE

# Cloudflare plans & limits reference page.
cloudflare_purge.limits:
  path: '/admin/config/cloudflare-purge/limits'
  defaults:
    _controller: '\Drupal\cloudflare_purge\Controller\CloudflarePurgeController::limits'
    _title: 'Plans & Limits'
  requirements:
    _permission: 'administer cloudflare purge+cloudflare purge+view cloudflare purge history'
  options:
    _admin_route: TRUE

# Clear purge history confirmation form.
cloudflare_purge.history_clear:
  path: '/admin/config/cloudflare-purge/history/clear'
  defaults:
    _form: '\Drupal\cloudflare_purge\Form\CloudflarePurgeClearHistory'
    _title: 'Clear purge history'
  requirements:
    _permission: 'administer cloudflare purge'
  options:
    _admin_route: TRUE
