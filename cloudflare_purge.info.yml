name: 'Cloudflare Purge'
type: module
description: 'Purges the Cloudflare cache by URL, cache tag, prefix or hostname, and can purge changed Drupal cache tags automatically, optionally in batches through a queue.'
package: 'Performance'
core_version_requirement: ^10 || ^11 || ^12
php: ^8.1
configure: cloudflare_purge.form

dependencies:
  - drupal:system
